<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebP to JPEG コンバーター</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #1e1e1e;
            color: #e0e0e0;
        }
        h1 {
            text-align: center;
            color: #f0f0f0;
        }
        .control-panel {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .control-panel label {
            font-weight: bold;
        }
        .control-panel input[type="range"] {
            width: 200px;
            cursor: pointer;
        }
        #quality-val {
            font-weight: bold;
            color: #64b5f6;
            min-width: 40px;
        }
        #drop-zone {
            border: 3px dashed #64b5f6;
            border-radius: 12px;
            background-color: #2d2d2d;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        /* ドラッグ中のスタイルをより明確に */
        #drop-zone.dragover {
            background-color: #3d4d5c !important;
            border-color: #64b5f6 !important;
            transform: scale(1.02);
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
        }
        #download-btn {
            display: block;
            width: 200px;
            margin: 20px auto;
            padding: 12px 24px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }
        #download-btn:hover {
            background-color: #45a049;
        }
        #file-list {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            background: #2d2d2d;
            padding: 10px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(255,255,255,0.05);
        }
        .file-item {
            font-size: 14px;
            padding: 5px 10px;
            border-bottom: 1px solid #444;
        }
    </style>
</head>
<body>

    <h1>WebP ➔ JPEG 一括変換 & Zip</h1>

    <div class="control-panel">
        <label for="quality-slider">JPEG 画質設定:</label>
        <input type="range" id="quality-slider" min="10" max="100" value="85" step="5">
        <span id="quality-val">85%</span>
    </div>

    <div id="drop-zone">
        <p style="font-size: 18px; margin: 0 0 10px 0; pointer-events: none;">ここにWebPファイルをドラッグ＆ドロップ</p>
        <p style="color: #b0b0b0; margin: 0; pointer-events: none;">またはクリックしてファイルを選択</p>
        <input type="file" id="file-input" multiple accept="image/webp" style="display: none;">
    </div>

    <div id="status"></div>
    <button id="download-btn">Zipファイルをダウンロード</button>
    <div id="file-list" style="display: none;"></div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const status = document.getElementById('status');
        const downloadBtn = document.getElementById('download-btn');
        const fileList = document.getElementById('file-list');
        const qualitySlider = document.getElementById('quality-slider');
        const qualityVal = document.getElementById('quality-val');

        let zip = null;

        // 画質スライダ
        qualitySlider.addEventListener('input', (e) => {
            qualityVal.textContent = e.target.value + '%';
        });

        // 【重要】画面全体のデフォルト挙動（ファイルを開く）を完全に無効化
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => e.preventDefault());

        // ドラッグエリアのイベント制御
        dropZone.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            // 境界線の出入りでのチラつき防止
            if (e.relatedTarget === null || !dropZone.contains(e.relatedTarget)) {
                dropZone.classList.remove('dragover');
            }
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            if (e.dataTransfer && e.dataTransfer.files) {
                handleFiles(e.dataTransfer.files);
            }
        });

        // クリックでのファイル選択
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files) handleFiles(e.target.files);
        });

        // ファイル処理
        async function handleFiles(files) {
            const webpFiles = Array.from(files).filter(file => file.name.toLowerCase().endsWith('.webp') || file.type === 'image/webp');
            
            if (webpFiles.length === 0) {
                status.innerHTML = '<span style="color: #e74c3c;">WebPファイルが見つかりませんでした。</span>';
                return;
            }

            status.textContent = '変換中...';
            downloadBtn.style.display = 'none';
            fileList.style.display = 'block';
            fileList.innerHTML = '';
            
            zip = new JSZip(); 
            let successCount = 0;
            const quality = parseFloat(qualitySlider.value) / 100;

            for (const file of webpFiles) {
                try {
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.textContent = `${file.name} ➔ 変換中...`;
                    fileList.appendChild(item);

                    const jpegBlob = await convertWebpToJpeg(file, quality);
                    const newFileName = file.name.replace(/\.webp$/i, '.jpg');
                    zip.file(newFileName, jpegBlob);

                    item.textContent = `✅ ${file.name} ➔ ${newFileName}`;
                    successCount++;
                } catch (error) {
                    console.error(error);
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.style.color = '#e74c3c';
                    item.textContent = `❌ ${file.name} の変換に失敗しました`;
                    fileList.appendChild(item);
                }
            }

            status.textContent = `${successCount} 個のファイルをJPEG（画質: ${qualitySlider.value}%）に変換しました！`;
            if (successCount > 0) {
                downloadBtn.style.display = 'block';
            }
        }

        // Canvas変換
        function convertWebpToJpeg(file, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0);
                        
                        canvas.toBlob((blob) => {
                            if (blob) resolve(blob);
                            else reject(new Error('Canvas to Blob failed'));
                        }, 'image/jpeg', quality); 
                    };
                    img.onerror = () => reject(new Error('Image load error'));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error('File read error'));
                reader.readAsDataURL(file);
            });
        }

        // Zipダウンロード
        downloadBtn.addEventListener('click', async () => {
            if (!zip) return;
            status.textContent = 'Zipファイルを生成中...';
            
            const content = await zip.generateAsync({ type: 'blob' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = `converted_images_${Date.now()}.zip`;
            link.click();
            
            status.textContent = 'ダウンロードが完了しました！';
        });
    </script>
</body>
</html>
